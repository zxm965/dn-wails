name: Build and publish desktop release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-refs/tags/${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REPOSITORY: zxm965/dn-wails

jobs:
  quality:
    name: Quality checks
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.33

      - name: Check release tag
        run: node scripts/configure-release.mjs "$RELEASE_TAG"

      - name: Generate Wails bindings
        run: wails3 generate bindings -clean=true -ts

      - name: Check frontend formatting
        run: pnpm --dir frontend fmt:check

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Check Go packages
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    environment: RELEASE
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            artifact: release-macos
          - name: Windows amd64
            runner: windows-latest
            artifact: release-windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.33

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $nsisCandidates = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS",
            "${env:ProgramFiles(x86)}\NSIS\Bin",
            "$env:ProgramFiles\NSIS\Bin"
          )
          $nsisBin = $nsisCandidates | Where-Object {
            Test-Path (Join-Path $_ 'makensis.exe')
          } | Select-Object -First 1
          if (-not $nsisBin) {
            throw 'NSIS was installed, but makensis.exe could not be found.'
          }
          $nsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$nsisBin;$env:PATH"
          Get-Command makensis -ErrorAction Stop | Select-Object -ExpandProperty Source

      - name: Verify Windows update handoff and NSIS installation
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CULL_PEAR_TEST_POWERSHELL: powershell.exe
          CULL_PEAR_REQUIRE_NSIS_TEST: '1'
        run: |
          go test ./internal/appupdate ./internal/platform/appupdate -count=1 -timeout 5m -parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater integration tests failed; release is blocked.' }

      - name: Configure release version
        shell: bash
        run: |
          node scripts/configure-release.mjs "$RELEASE_TAG"
          wails3 task common:update:build-assets

      - name: Prepare embedded runtime configuration
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/prepare-release-environment.mjs

      - name: Build macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          ldflags="-X cull-pear/internal/buildinfo.Version=$version -X cull-pear/internal/buildinfo.Repository=$RELEASE_REPOSITORY"
          wails3 task darwin:package:universal LD_FLAGS="$ldflags"
          app_bundle="bin/$(node scripts/app-display-name.mjs).app"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" bin/cull-pear-darwin-universal.zip
          hdiutil create -volname "$(node scripts/app-display-name.mjs)" -srcfolder "$app_bundle" -ov -format UDZO bin/cull-pear-darwin-universal.dmg

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $ldflags = "-X cull-pear/internal/buildinfo.Version=$version -X cull-pear/internal/buildinfo.Repository=$env:RELEASE_REPOSITORY"
          wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user LD_FLAGS=$ldflags
          if ($LASTEXITCODE -ne 0) { throw "Windows NSIS packaging failed with exit code $LASTEXITCODE" }

          $installer = Join-Path $pwd 'bin/cull-pear-amd64-installer.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Windows NSIS installer was not generated: $installer"
          }
          if ((Get-Item -LiteralPath $installer).Length -le 0) {
            throw "Windows NSIS installer is empty: $installer"
          }
          Move-Item -LiteralPath $installer -Destination 'bin/cull-pear-windows-amd64-installer.exe' -Force

          $binary = Join-Path $pwd 'bin/cull-pear.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Windows application binary was not generated: $binary"
          }
          Copy-Item -LiteralPath $binary -Destination 'bin/cull-pear-windows-amd64.exe' -Force

      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/cull-pear-darwin-universal.zip
            bin/cull-pear-darwin-universal.dmg
          if-no-files-found: error

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/cull-pear-windows-amd64.exe
            bin/cull-pear-windows-amd64-installer.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: RELEASE
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Generate GitHub update manifest
        run: |
          node scripts/generate-update-manifest.mjs \
            "$RELEASE_TAG" \
            "$RELEASE_REPOSITORY" \
            release

      - name: Generate GitHub checksums
        shell: bash
        run: find release -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
