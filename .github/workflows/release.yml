name: Build and publish desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096
  GITEE_REPOSITORY: zxm965/dn-wails

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Check release tag
        run: node scripts/configure-release.mjs "$GITHUB_REF_NAME"

      - name: Generate Wails bindings
        run: wails3 generate bindings -clean=true -ts

      - name: Check frontend formatting
        run: pnpm --dir frontend fmt:check

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Check Go packages
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    environment: RELEASE
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            artifact: release-macos
          - name: Windows amd64
            runner: windows-latest
            artifact: release-windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisCandidates = @(
            "${env:ProgramFiles(x86)}\NSIS\Bin",
            "$env:ProgramFiles\NSIS\Bin"
          )
          $nsisBin = $nsisCandidates | Where-Object {
            Test-Path (Join-Path $_ 'makensis.exe')
          } | Select-Object -First 1
          if (-not $nsisBin) {
            throw 'NSIS was installed, but makensis.exe could not be found.'
          }
          $nsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$nsisBin;$env:PATH"
          Get-Command makensis -ErrorAction Stop | Select-Object -ExpandProperty Source

      - name: Configure release version
        shell: bash
        run: |
          node scripts/configure-release.mjs "${{ github.ref_name }}"
          wails3 task common:update:build-assets

      - name: Prepare embedded runtime configuration
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/prepare-release-environment.mjs

      - name: Build macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-X cull-pear/internal/buildinfo.Version=$version -X cull-pear/internal/buildinfo.Repository=$GITEE_REPOSITORY"
          wails3 task darwin:package:universal LD_FLAGS="$ldflags"
          app_bundle="bin/$(node scripts/app-display-name.mjs).app"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" bin/cull-pear-darwin-universal.zip
          hdiutil create -volname "$(node scripts/app-display-name.mjs)" -srcfolder "$app_bundle" -ov -format UDZO bin/cull-pear-darwin-universal.dmg

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $ldflags = "-X cull-pear/internal/buildinfo.Version=$version -X cull-pear/internal/buildinfo.Repository=$env:GITEE_REPOSITORY"
          wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user LD_FLAGS=$ldflags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item bin/cull-pear-amd64-installer.exe bin/cull-pear-windows-amd64-installer.exe

      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/cull-pear-darwin-universal.zip
            bin/cull-pear-darwin-universal.dmg
          if-no-files-found: error

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: bin/cull-pear-windows-amd64-installer.exe
          if-no-files-found: error

  release:
    name: Publish GitHub and Gitee Releases
    needs: build
    runs-on: ubuntu-latest
    environment: RELEASE
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Generate GitHub update manifest
        run: |
          node scripts/generate-update-manifest.mjs \
            "$GITHUB_REF_NAME" \
            "$GITEE_REPOSITORY" \
            release \
            https://github.com

      - name: Generate GitHub checksums
        shell: bash
        run: find release -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Generate Gitee update manifest
        run: |
          node scripts/generate-update-manifest.mjs \
            "$GITHUB_REF_NAME" \
            "$GITEE_REPOSITORY" \
            release \
            https://gitee.com

      - name: Generate Gitee checksums
        shell: bash
        run: find release -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt

      - name: Publish Gitee release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/gitee-release-notes.md
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq '.body' > "$RELEASE_NOTES_FILE"
          node scripts/publish-gitee-release.mjs \
            "$GITHUB_REF_NAME" \
            "$GITEE_REPOSITORY" \
            release \
            "$GITHUB_SHA"
