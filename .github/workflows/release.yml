name: Build and publish desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.3

      - name: Check release tag
        run: node scripts/configure-release.mjs "$GITHUB_REF_NAME"

      - name: Generate Wails bindings
        run: wails3 generate bindings -clean=true -ts

      - name: Check frontend formatting
        run: pnpm --dir frontend fmt:check

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Check Go packages
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    environment: RELEASE
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            artifact: release-macos
          - name: Windows amd64
            runner: windows-latest
            artifact: release-windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.3

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure release version
        shell: bash
        run: |
          node scripts/configure-release.mjs "${{ github.ref_name }}"
          wails3 task common:update:build-assets

      - name: Prepare embedded runtime configuration
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_UPDATE_BASE_URL: ${{ secrets.APP_UPDATE_BASE_URL }}
          TENCENT_COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
        run: node scripts/prepare-release-environment.mjs

      - name: Build macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-X dn-wails/internal/buildinfo.Version=$version -X dn-wails/internal/buildinfo.Repository=$GITHUB_REPOSITORY"
          wails3 task darwin:package:universal LD_FLAGS="$ldflags"
          ditto -c -k --sequesterRsrc --keepParent bin/dn-wails.app bin/dn-wails-darwin-universal.zip
          hdiutil create -volname "dn-wails" -srcfolder bin/dn-wails.app -ov -format UDZO bin/dn-wails-darwin-universal.dmg

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $ldflags = "-X dn-wails/internal/buildinfo.Version=$version -X dn-wails/internal/buildinfo.Repository=$env:GITHUB_REPOSITORY"
          wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user LD_FLAGS=$ldflags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item bin/dn-wails-amd64-installer.exe bin/dn-wails-windows-amd64-installer.exe

      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/dn-wails-darwin-universal.zip
            bin/dn-wails-darwin-universal.dmg
          if-no-files-found: error

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: bin/dn-wails-windows-amd64-installer.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment: RELEASE
    env:
      COSCLI_VERSION: v1.0.8
      COSCLI_LINUX_AMD64_SHA256: 7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate GitHub compatibility manifest
        run: node scripts/generate-update-manifest.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" release

      - name: Generate GitHub compatibility checksums
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/github-release-metadata"
          cp release/latest.json release/SHA256SUMS.txt "$RUNNER_TEMP/github-release-metadata/"

      - name: Validate Tencent Cloud COS configuration
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          APP_UPDATE_BASE_URL: ${{ secrets.APP_UPDATE_BASE_URL }}
          COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
        run: |
          set -euo pipefail

          if [[ -z "$COS_SECRET_ID" ]]; then
            echo "::error::GitHub Secret TENCENT_SECRET_ID is required"
            exit 1
          fi
          if [[ -z "$COS_SECRET_KEY" ]]; then
            echo "::error::GitHub Secret TENCENT_SECRET_KEY is required"
            exit 1
          fi
          node scripts/print-cos-release-config.mjs "$APP_UPDATE_BASE_URL" "${COS_PREFIX:-dn-wails}" >/dev/null

      - name: Generate Tencent Cloud COS update manifest
        shell: bash
        env:
          APP_UPDATE_BASE_URL: ${{ secrets.APP_UPDATE_BASE_URL }}
          COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
        run: |
          set -euo pipefail
          node scripts/generate-update-manifest.mjs \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            release \
            "$APP_UPDATE_BASE_URL" \
            "${COS_PREFIX:-dn-wails}"
          find release -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/cos-release-metadata"
          cp release/latest.json "$RUNNER_TEMP/cos-release-metadata/latest.json"

      - name: Install Tencent Cloud COSCLI
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/coscli"
          coscli_path="$install_dir/coscli"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64" \
            --output "$coscli_path"
          echo "$COSCLI_LINUX_AMD64_SHA256  $coscli_path" | sha256sum --check
          chmod 755 "$coscli_path"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Upload version packages to Tencent Cloud COS
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          APP_UPDATE_BASE_URL: ${{ secrets.APP_UPDATE_BASE_URL }}
          COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
        run: |
          set -euo pipefail

          config="$(node scripts/print-cos-release-config.mjs "$APP_UPDATE_BASE_URL" "${COS_PREFIX:-dn-wails}")"
          bucket="$(jq --raw-output '.bucket' <<< "$config")"
          region="$(jq --raw-output '.region' <<< "$config")"
          prefix="$(jq --raw-output '.prefix' <<< "$config")"
          version_target="cos://${bucket}/${prefix}/${GITHUB_REF_NAME}/"

          coscli cp release/ "$version_target" \
            --recursive \
            --endpoint "cos.${region}.myqcloud.com" \
            --secret-id "$COS_SECRET_ID" \
            --secret-key "$COS_SECRET_KEY" \
            --init-skip \
            --disable-log \
            --bucket-type COS \
            --meta "Cache-Control:public,max-age=31536000,immutable"

          echo "Uploaded release packages to \`$version_target\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore GitHub compatibility metadata
        shell: bash
        run: cp "$RUNNER_TEMP/github-release-metadata/latest.json" "$RUNNER_TEMP/github-release-metadata/SHA256SUMS.txt" release/

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Promote latest Tencent Cloud COS manifest
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          APP_UPDATE_BASE_URL: ${{ secrets.APP_UPDATE_BASE_URL }}
          COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
        run: |
          set -euo pipefail

          config="$(node scripts/print-cos-release-config.mjs "$APP_UPDATE_BASE_URL" "${COS_PREFIX:-dn-wails}")"
          bucket="$(jq --raw-output '.bucket' <<< "$config")"
          region="$(jq --raw-output '.region' <<< "$config")"
          prefix="$(jq --raw-output '.prefix' <<< "$config")"
          update_base_url="$(jq --raw-output '.updateBaseURL' <<< "$config")"
          latest_target="cos://${bucket}/${prefix}/latest.json"
          candidate_manifest="$RUNNER_TEMP/cos-release-metadata/latest.json"
          current_manifest="$RUNNER_TEMP/current-update-manifest.json"
          latest_status="$(curl \
            --max-filesize 2097152 \
            --output "$current_manifest" \
            --proto '=https' \
            --silent \
            --show-error \
            --write-out '%{http_code}' \
            "${update_base_url}/latest.json?github_run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"

          promote_latest=true
          case "$latest_status" in
            200)
              promote_latest="$(node scripts/should-promote-update-manifest.mjs "$GITHUB_REF_NAME" "$current_manifest" "$GITHUB_REPOSITORY")"
              ;;
            404)
              ;;
            *)
              echo "::error::Read current COS update manifest failed with HTTP status $latest_status"
              exit 1
              ;;
          esac

          if [[ "$promote_latest" == "true" ]]; then
            coscli cp "$candidate_manifest" "$latest_target" \
              --endpoint "cos.${region}.myqcloud.com" \
              --secret-id "$COS_SECRET_ID" \
              --secret-key "$COS_SECRET_KEY" \
              --init-skip \
              --disable-log \
              --bucket-type COS \
              --meta "Cache-Control:no-cache"

            published_manifest="$RUNNER_TEMP/published-update-manifest.json"
            curl \
              --fail \
              --max-filesize 2097152 \
              --proto '=https' \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --silent \
              --show-error \
              "${update_base_url}/latest.json?github_run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-verify" \
              --output "$published_manifest"
            cmp "$candidate_manifest" "$published_manifest"
          fi

          echo "Update manifest: \`${update_base_url}/latest.json\` (promoted: \`$promote_latest\`)." >> "$GITHUB_STEP_SUMMARY"
