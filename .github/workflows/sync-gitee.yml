name: Sync source to Gitee

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee-source
  cancel-in-progress: false

env:
  GITEE_REPOSITORY: zxm965/dn-wails

jobs:
  sync:
    name: Sync branches and tags
    if: github.repository == 'zxm965/dn-wails'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Push GitHub refs to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          test -n "$GITEE_TOKEN"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/github/*' '+refs/tags/*:refs/tags/*'
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPOSITORY}.git"
          git push gitee --force \
            'refs/remotes/github/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
