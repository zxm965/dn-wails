version: '3'

info:
  companyName: 'zxm965'
  productName: 'Cull Pear'
  productIdentifier: 'com.zxm965.cullpear'
  description: 'Cull Pear desktop application'
  copyright: '© 2026, zxm965'
  comments: 'Built with Wails v3'
  version: '0.0.15'

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - '*_test.go'
    watched_extension:
      - '*.go'
      - '*.js'
      - '*.ts'
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true EXTRA_TAGS=dev
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:

other: []
